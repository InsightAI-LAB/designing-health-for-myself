name: Website checks and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only. Only the deploy job gets Pages/OIDC permissions.
permissions:
  contents: read

# Serialize main runs through deployment without canceling an active publish.
# PRs have separate groups and can never publish.
concurrency:
  group: website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check source
        run: python3 scripts/check_site.py

      - name: Build public files
        run: python3 scripts/build_site.py

      - name: Check built site
        run: python3 scripts/check_site.py --root _site

      # Only a trusted main run with explicit repository opt-in makes an artifact.
      - name: Upload Pages artifact
        if: >-
          vars.PAGES_DEPLOY_ENABLED == 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 7
          # _site is a public-only allowlist; retain its intentional .nojekyll.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # A maintainer must enable Pages explicitly in repository settings.
          enablement: false

      - name: Publish checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
